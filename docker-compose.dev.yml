services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - pgdata_dev:/var/lib/postgresql/data
        networks:
            - net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    migrate:
        container_name: rag-migrate-dev
        build:
            context: .
            dockerfile: Dockerfile.dev
        networks:
            - net
        env_file:
            - .env.dev
        environment:
            PYTHONPATH: /app
        volumes:
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic
        depends_on:
            db:
                condition: service_healthy
        command: alembic upgrade head

    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        ports:
            - "${PORT:-8000}:${PORT:-8000}"
        env_file:
            - .env.dev
        environment:
            PYTHONPATH: /app
            PORT: ${PORT:-8000}
            WORKERS_NUMBER: ${WORKERS_NUMBER:-1}
            DB_HOST: ${DB_HOST}
        volumes:
            - ./src:/app/src:ro
            - ./alembic.ini:/app/alembic.ini:ro
            - ./alembic:/app/alembic
            - logs_dev:/app/logs
        networks:
            - net
        depends_on:
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "python3",
                    "-c",
                    "import urllib.request, os; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT','8000') + '/api/v' + os.environ.get('API_VERSION','1') + '/health')",
                ]
            interval: 30s
            timeout: 10s
            start_period: 15s
            retries: 3

    nginx:
        build:
            context: ./nginx
        image: nginx:alpine
        restart: unless-stopped
        environment:
            API_HOST: app
            API_PORT: ${PORT:-8000}
        volumes:
            - ./nginx/templates/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
        ports:
            - "443:443"
        networks:
            - net
        depends_on:
            app:
                condition: service_healthy

volumes:
    pgdata_dev:
    logs_dev:


networks:
  net:
    driver: bridge